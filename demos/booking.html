<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumière Studio — Book an Appointment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2fb;--ink:#22183a;--accent:#7a5bc0;--soft:#e7defa;--muted:#6f6688;--card:#fff;
  --display:"Cormorant Garamond",Georgia,serif;--body:"Manrope",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);min-height:100vh}
.layout{display:grid;grid-template-columns:minmax(280px,420px) 1fr;min-height:100vh}
aside{background:linear-gradient(170deg,#3a2a63,#22183a);color:#efe8ff;padding:clamp(28px,5vw,56px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
aside h1{font-family:var(--display);font-size:clamp(44px,5vw,64px);line-height:.95;font-weight:500}
aside h1 i{color:#c9b6ff}
aside p{opacity:.8;margin-top:14px}
.summary{background:rgba(255,255,255,.08);border-radius:18px;padding:18px;font-size:15px}
.summary div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.summary div:last-child{border:0;font-weight:700}
main{padding:clamp(24px,5vw,56px);max-width:760px}
.step{margin-bottom:36px}
.step h2{font-family:var(--display);font-size:30px;font-weight:700;margin-bottom:14px}
.step h2 span{font-family:var(--body);font-size:13px;color:var(--accent);letter-spacing:.12em;display:block;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.opt{background:var(--card);border:1.5px solid transparent;border-radius:16px;padding:14px 16px;text-align:left;font:inherit;cursor:pointer;transition:border-color .15s,transform .12s}
.opt:hover{border-color:var(--soft)} .opt:active{transform:scale(.98)}
.opt[aria-pressed=true]{border-color:var(--accent);background:#fbf9ff}
.opt b{display:block} .opt small{color:var(--muted)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.days .opt{min-width:74px;text-align:center}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slots .opt{text-align:center;padding:10px}
.opt:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--soft);font:inherit;margin-bottom:10px;background:#fff}
input:focus{outline:none;border-color:var(--accent)}
.confirm{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 28px;font:700 16px var(--body);cursor:pointer;transition:background .15s}
.confirm:disabled{background:#bfb3dc;cursor:not-allowed}
.done{display:none;background:var(--card);border-radius:20px;padding:28px;border-left:4px solid var(--accent)}
.done.show{display:block}
.done h2{font-family:var(--display);font-size:34px}
.badge{display:block;background:#000;color:#fff;font-size:12px;padding:7px 12px;text-align:center;text-decoration:none}
button:focus-visible{outline:3px solid #c9b6ff;outline-offset:2px}
@media (max-width:820px){.layout{grid-template-columns:1fr} aside{min-height:auto}}
</style>
</head>
<body>
<a class="badge" href="../index.html">← Portfolio demo</a>
<div class="layout">
  <aside>
    <div><h1>Lumière <i>Studio</i></h1><p>Hair, nails and braids in Osu. Book in 30 seconds, no phone calls needed.</p></div>
    <div class="summary" aria-live="polite">
      <div><span>Service</span><span id="sService">—</span></div>
      <div><span>Day</span><span id="sDay">—</span></div>
      <div><span>Time</span><span id="sTime">—</span></div>
      <div><span>Total</span><span id="sTotal">GH₵ 0</span></div>
    </div>
  </aside>
  <main>
    <form id="form">
      <div class="step"><h2><span>STEP 1</span>Choose a service</h2><div class="grid" id="services"></div></div>
      <div class="step"><h2><span>STEP 2</span>Pick a day</h2><div class="days" id="days"></div></div>
      <div class="step"><h2><span>STEP 3</span>Pick a time</h2><div class="slots" id="slots"><small>Choose a day first.</small></div></div>
      <div class="step"><h2><span>STEP 4</span>Your details</h2>
        <input id="name" placeholder="Your name" autocomplete="name" required>
        <input id="phone" placeholder="Phone (e.g. 024 000 0000)" inputmode="tel" autocomplete="tel" required>
        <button class="confirm" id="confirm" disabled>Confirm booking</button>
      </div>
    </form>
    <div class="done" id="done" role="status"><h2>You're booked ✨</h2><p id="doneText"></p></div>
  </main>
</div>
<script>
const SERVICES = [
  {id:"braids",name:"Knotless braids",mins:240,price:350},
  {id:"silk",name:"Silk press",mins:90,price:180},
  {id:"nails",name:"Gel manicure",mins:60,price:120},
  {id:"lashes",name:"Lash extensions",mins:120,price:250},
  {id:"cut",name:"Cut & style",mins:60,price:100},
];
const OPEN_HOUR = 9, CLOSE_HOUR = 19;
const state = {service:null, day:null, time:null};
const fmt = n => "GH₵ " + n;

// Fake "already booked" slots so the demo feels real, stable per day
const takenFor = d => new Set([10,13,16].map(h => (h + d.getDate()) % (CLOSE_HOUR-OPEN_HOUR) + OPEN_HOUR));

function nextDays(n){
  const out=[], d=new Date(); d.setHours(0,0,0,0);
  while(out.length<n){ d.setDate(d.getDate()+1); if(d.getDay()!==0) out.push(new Date(d)); }
  return out;
}
const DAYS = nextDays(10);

function btn(attrs, inner){ return `<button type="button" class="opt" ${attrs}>${inner}</button>`; }
function render(){
  document.getElementById("services").innerHTML = SERVICES.map(s =>
    btn(`data-service="${s.id}" aria-pressed="${state.service===s.id}"`, `<b>${s.name}</b><small>${s.mins/60}h · ${fmt(s.price)}</small>`)).join("");
  document.getElementById("days").innerHTML = DAYS.map((d,i) =>
    btn(`data-day="${i}" aria-pressed="${state.day===i}"`, `<small>${d.toLocaleDateString("en-GB",{weekday:"short"})}</small><b>${d.getDate()}</b>`)).join("");
  if (state.day !== null){
    const svc = SERVICES.find(s=>s.id===state.service);
    const lastStart = CLOSE_HOUR - Math.ceil((svc?.mins||60)/60);
    const taken = takenFor(DAYS[state.day]);
    const hours = Array.from({length:CLOSE_HOUR-OPEN_HOUR},(_,i)=>OPEN_HOUR+i);
    document.getElementById("slots").innerHTML = hours.map(h =>
      btn(`data-time="${h}" aria-pressed="${state.time===h}" ${taken.has(h)||h>lastStart?"disabled":""}`, `${String(h).padStart(2,"0")}:00`)).join("");
  }
  const svc = SERVICES.find(s=>s.id===state.service);
  document.getElementById("sService").textContent = svc ? svc.name : "—";
  document.getElementById("sDay").textContent = state.day!==null ? DAYS[state.day].toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}) : "—";
  document.getElementById("sTime").textContent = state.time!==null ? `${state.time}:00` : "—";
  document.getElementById("sTotal").textContent = fmt(svc ? svc.price : 0);
  validate();
}
function validate(){
  const ok = state.service && state.day!==null && state.time!==null &&
    document.getElementById("name").value.trim().length>1 &&
    /^[0-9+ ]{9,15}$/.test(document.getElementById("phone").value.trim());
  document.getElementById("confirm").disabled = !ok;
}
document.addEventListener("click", e => {
  const o = e.target.closest(".opt"); if(!o || o.disabled) return;
  if (o.dataset.service){ state.service=o.dataset.service; state.time=null; }
  if (o.dataset.day){ state.day=+o.dataset.day; state.time=null; }
  if (o.dataset.time){ state.time=+o.dataset.time; }
  render();
});
document.getElementById("form").addEventListener("input", validate);
document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const svc = SERVICES.find(s=>s.id===state.service);
  document.getElementById("form").style.display="none";
  document.getElementById("doneText").textContent =
    `Thanks ${document.getElementById("name").value.trim()}! ${svc.name} on ${DAYS[state.day].toDateString()} at ${state.time}:00. We'll text a reminder the day before.`;
  document.getElementById("done").classList.add("show");
});
render();
</script>
</body>
</html>
